name: CI/CD Pipeline

permissions:
  contents: read

on:
  push:
    branches: [ main, master, "quality/security-baseline" ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Lint, Type Check & Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      matrix:
        python-version: ["3.11"]

    env:
      GOOGLE_API_KEY: mock-ci-token-not-used-for-real-calls
      JWT_SECRET_KEY: ci-secret-key-for-testing-only-at-least-32chars

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints-linux-py311.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip 'setuptools==84.2.1'
          pip install torch==2.15.0+cpu --index-url https://download.pytorch.org/whl/cpu
          pip install -c constraints-linux-py311.txt -r requirements.txt
          pip install -c constraints-linux-py311.txt ruff mypy bandit pip-audit

      - name: Run Ruff Linter & Formatting Check
        run: |
          ruff check .

      - name: Run MyPy Static Type Analysis
        run: |
          mypy --explicit-package-bases api services src

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r api services src -ll

      - name: Run Pip-Audit Dependency Security Scan
        run: |
          pip-audit
          python -c 'import torch; assert torch.version.cuda is None; print(torch.__version__.split("+")[0])' > torch-version.txt
          printf 'torch==%s\n' "$(cat torch-version.txt)" > torch-audit.txt
          pip-audit --no-deps --disable-pip -r torch-audit.txt

      - name: Run Automated Test Suite with Coverage
        if: success() || failure()
        run: |
          pytest tests/ -v --cov=. --cov-report=term-missing --cov-report=xml

      - name: Record resolved Python dependencies
        if: always()
        run: python -m pip freeze --all > resolved-requirements.txt

      - name: Upload resolved Python dependencies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resolved-python-dependencies
          path: resolved-requirements.txt

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  frontend-build:
    name: Frontend Type Check & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build React + Vite Production Bundle
        run: npm run build

  docker-build:
    name: Container Build Verification
    # Playwright 1.58.2 supports Ubuntu 24.04, not the current ubuntu-latest (26.04).
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [backend-quality-and-tests, frontend-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ragbot-backend:latest
          cache-from: type=gha,scope=ragbot-backend
          cache-to: type=gha,mode=max,scope=ragbot-backend

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          load: true
          tags: ragbot-frontend:latest
          cache-from: type=gha,scope=ragbot-frontend
          cache-to: type=gha,mode=max,scope=ragbot-frontend

      - name: Run container integration smoke checks
        run: |
          docker network create ragbot-ci
          docker run -d --name backend --network ragbot-ci \
            -e GOOGLE_API_KEY=mock-ci-token-not-used-for-real-calls \
            -e JWT_SECRET_KEY=ci-secret-key-for-testing-only-at-least-32chars \
            ragbot-backend:latest
          docker run -d --name frontend --network ragbot-ci -p 127.0.0.1:18080:80 ragbot-frontend:latest
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health; then break; fi
            sleep 2
          done
          python3 scripts/container_smoke.py

      - name: Bounded health endpoint load benchmark
        run: python scripts/load_smoke.py

      - name: Upload load benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: load-smoke-results
          path: load-smoke-results.json

      - name: Install browser test runner
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.58.2
          npx playwright install --with-deps chromium

      - name: Desktop and mobile browser tests
        working-directory: frontend
        run: npx playwright test e2e/browser.spec.cjs --reporter=list

      - name: Container diagnostics and cleanup
        if: always()
        run: |
          docker logs backend || true
          docker logs frontend || true
          docker rm -f frontend backend || true
          docker network rm ragbot-ci || true
