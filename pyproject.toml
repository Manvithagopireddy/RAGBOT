[project]
name = "ragbot"
version = "2.0.0"
description = "Enterprise Hybrid RAG Platform"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "B008", # Do not perform function call in argument defaults (FastAPI Depends/Security standard)
    "B904", # Within an except clause, raise exceptions with raise ... from
    "B905", # zip() without strict
    "E501", # Line too long (handled by formatter)
    "C408", # Unnecessary dict call
    "E402", # Module level import not at top of file (needed for sys.path prepends)
    "E702", # Multiple statements on one line
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
