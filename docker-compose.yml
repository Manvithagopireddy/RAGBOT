version: '3.8'

services:
  # FastAPI REST API Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragbot_backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set a strong JWT_SECRET_KEY in .env}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
    volumes:
      - ragbot_chats:/app/chats
      - ragbot_uploads:/app/uploads
      - ragbot_vector_store:/app/vector_store
      - ./knowledge_base:/app/knowledge_base:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # React + TypeScript Web Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ragbot_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # Streamlit UI (Legacy / Data Science Showcase)
  streamlit:
    profiles: [legacy]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragbot_streamlit
    command: ["streamlit", "run", "app.py", "--server.port=8501", "--server.address=0.0.0.0", "--server.headless=true"]
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ragbot_legacy_chats:/app/chats
      - ragbot_legacy_uploads:/app/uploads
      - ragbot_legacy_vectors:/app/vector_store
      - ./knowledge_base:/app/knowledge_base:ro
    restart: unless-stopped

volumes:
  ragbot_chats:
  ragbot_uploads:
  ragbot_vector_store:
  ragbot_legacy_chats:
  ragbot_legacy_uploads:
  ragbot_legacy_vectors:
